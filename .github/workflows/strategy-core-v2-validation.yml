# validation-candidate: 345299159f3af92f748a10c172e00990992b3a09
name: Strategy Core V2 validation

on:
  push:
    branches: [main]
    paths: ['.github/workflows/strategy-core-v2-validation.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Strategy Core V2 branch
        uses: actions/checkout@v4
        with:
          ref: feature/strategy-core-v2
      - name: Capture V2 SHA
        id: feature
        shell: bash
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Checkout main for validation receipt
        uses: actions/checkout@v4
        with:
          ref: main
          path: validation-receipt
      - name: Record validation start
        shell: bash
        env:
          FEATURE_SHA: ${{ steps.feature.outputs.sha }}
        run: |
          set -euo pipefail
          cd validation-receipt
          mkdir -p .github
          printf 'status=running\nfeature_sha=%s\nrun_id=%s\n' "$FEATURE_SHA" "$GITHUB_RUN_ID" > .github/strategy-core-v2-status.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/strategy-core-v2-status.txt
          if ! git diff --cached --quiet; then git commit -m "[skip ci] Record Strategy Core V2 validation start"; git push origin HEAD:main; fi
      - name: Syntax check V2 core
        run: |
          for f in \
            src/v2/world/graph.js \
            src/v2/core/operations.js src/v2/core/engine.js src/v2/core/save.js \
            src/v2/data/wano-network.js src/v2/data/wano-settlements.js src/v2/data/wano-scenario.js \
            src/v2/domain/supply.js src/v2/domain/battles.js src/v2/domain/settlements.js src/v2/domain/sieges.js src/v2/domain/invariants.js \
            src/v2/domain/diplomacy.js src/v2/domain/commands.js src/v2/domain/missions.js src/v2/domain/onepiece.js src/v2/domain/recovery.js src/v2/domain/transports.js \
            src/v2/ai/reactive.js src/v2/ai/strategic.js src/v2/ai/theater.js src/v2/ai/director.js; do node --check "$f"; done
      - name: Run V2 strategy-core tests
        run: node --test tests/v2-*.test.mjs
      - name: Run repository regression suite
        run: npm test
      - name: Record validation result
        if: always()
        shell: bash
        env:
          FEATURE_SHA: ${{ steps.feature.outputs.sha }}
          JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          cd validation-receipt
          git pull --ff-only origin main
          printf 'status=%s\nfeature_sha=%s\nrun_id=%s\n' "$JOB_STATUS" "$FEATURE_SHA" "$GITHUB_RUN_ID" > .github/strategy-core-v2-status.txt
          git add .github/strategy-core-v2-status.txt
          if ! git diff --cached --quiet; then git commit -m "[skip ci] Record Strategy Core V2 validation result"; git push origin HEAD:main; fi
