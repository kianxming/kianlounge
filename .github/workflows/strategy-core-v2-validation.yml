name: Strategy Core V2 playable validation and Pages

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/strategy-core-v2-validation.yml'
      - '.github/scripts/repair-v2-sources.py'
      - '.github/scripts/patch-v2-mobile.py'
      - '.github/scripts/patch-v2-ux.py'
      - '.github/scripts/patch-v2-ux-hotfix.py'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: strategy-core-v2-pages
  cancel-in-progress: true

jobs:
  validate-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Strategy Core V2 candidate
        uses: actions/checkout@v4
        with:
          ref: feature/strategy-core-v2

      - name: Capture candidate SHA
        id: candidate
        shell: bash
        run: |
          set -euo pipefail
          sha=$(git rev-parse HEAD)
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]]

      - name: Checkout main validation helpers
        uses: actions/checkout@v4
        with:
          ref: main
          path: validation-receipt

      - name: Record validation start
        shell: bash
        env:
          FEATURE_SHA: ${{ steps.candidate.outputs.sha }}
        run: |
          set -euo pipefail
          cd validation-receipt
          mkdir -p .github
          printf 'status=running\npage_url=\nfeature_sha=%s\npublished_sha=\nrun_id=%s\n' "$FEATURE_SHA" "$GITHUB_RUN_ID" > .github/strategy-core-v2-status.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- .github/strategy-core-v2-status.txt
          if ! git diff --cached --quiet; then
            git commit -m '[skip ci] Record Strategy Core V2 validation start'
            git push origin HEAD:main
          fi

      - name: Recover and patch V2 playable surface
        shell: bash
        run: |
          set -euo pipefail
          python3 validation-receipt/.github/scripts/repair-v2-sources.py
          python3 validation-receipt/.github/scripts/patch-v2-mobile.py
          python3 validation-receipt/.github/scripts/patch-v2-ux.py
          python3 validation-receipt/.github/scripts/patch-v2-ux-hotfix.py

      - name: Syntax and repository regression tests
        shell: bash
        run: |
          set -euo pipefail
          find src/v2 -name '*.js' -print0 | xargs -0 -n1 node --check
          node --check src/data.js
          node --check src/assets.js
          node --check e2e/v2-final.spec.mjs
          npm test

      - name: Install Playwright test runner
        run: npm install --no-save @playwright/test@1.55.0

      - name: Run real Chrome V2 E2E
        run: npx playwright test e2e/v2-final.spec.mjs --project=chrome-desktop --project=chrome-tablet --project=chrome-iphone

      - name: Upload browser evidence on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: v2-e2e-artifacts-${{ github.run_id }}
          path: |
            test-results
            playwright-report
          if-no-files-found: ignore
          retention-days: 7

      - name: Publish verified V2 sources and player-experience test
        if: success()
        id: publish
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- src/v2/ui/app.js v2.css e2e/v2-final.spec.mjs
          if ! git diff --cached --quiet; then
            git commit -m 'V2: map-first mobile UX and battle tracking [skip ci]'
            git push origin HEAD:feature/strategy-core-v2
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Stage clean Pages artifact
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site
          cp v2.html _site/index.html
          cp v2.html v2.css _site/
          cp -R src assets _site/
          touch _site/.nojekyll
          test -f _site/index.html
          test -f _site/v2.css
          test -f _site/src/v2/ui/app.js
          test -f _site/assets/v3/wano-terrain.svg
          test ! -e _site/node_modules
          test ! -e _site/test-results
          test ! -e _site/validation-receipt

      - name: Configure Pages
        if: success()
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        if: success()
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy Pages
        if: success()
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Record final validation and deployment result
        if: always()
        shell: bash
        env:
          FEATURE_SHA: ${{ steps.candidate.outputs.sha }}
          PUBLISHED_SHA: ${{ steps.publish.outputs.sha }}
          JOB_STATUS: ${{ job.status }}
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          cd validation-receipt
          git pull --ff-only origin main
          printf 'status=%s\npage_url=%s\nfeature_sha=%s\npublished_sha=%s\nrun_id=%s\n' "$JOB_STATUS" "$PAGE_URL" "$FEATURE_SHA" "$PUBLISHED_SHA" "$GITHUB_RUN_ID" > .github/strategy-core-v2-status.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- .github/strategy-core-v2-status.txt
          if ! git diff --cached --quiet; then
            git commit -m '[skip ci] Record Strategy Core V2 playable validation result'
            git push origin HEAD:main
          fi
