name: Deploy Wano prototype to GitHub Pages

on:
  push:
    branches:
      - feature/wano-web-vertical-slice
  pull_request:
    branches:
      - main
    types:
      - synchronize
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/wano-web-vertical-slice

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Validate static build
        run: |
          set -euo pipefail
          node --check src/data.js
          node --check src/world.js
          node --check src/tactical.js
          node --check src/simulation.js
          node --check src/view.js
          node --check src/ui.js
          node --check src/main.js
          npm test

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
