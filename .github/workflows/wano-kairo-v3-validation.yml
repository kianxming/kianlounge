name: Wano Kairo V3 validation

on:
  push:
    branches:
      - feature/wano-kairo-v3
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check V3
        run: |
          set -euo pipefail
          find src/v3 -name '*.js' -print0 | xargs -0 -n1 node --check
          node --check e2e/v3-smoke.spec.mjs
      - name: Run repository and V3 simulation tests
        run: npm test
      - name: Install Playwright runner
        run: npm install --no-save @playwright/test@1.55.0
      - name: Run V3 desktop and iPhone smoke tests
        run: npx playwright test e2e/v3-smoke.spec.mjs --project=chrome-desktop --project=chrome-iphone
      - name: Upload traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: v3-validation-${{ github.run_id }}
          path: |
            test-results
            playwright-report
          if-no-files-found: ignore
