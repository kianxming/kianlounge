# validation-candidate: 22b0a31c53d5229231ec961511b90c1c6aeca327
name: Wano v1 validation and GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/wano-preview-pages.yml'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: wano-pages-preview
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Wano v1 feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/wano-web-vertical-slice

      - name: Capture feature SHA
        id: feature
        shell: bash
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Checkout main for validation receipt
        uses: actions/checkout@v4
        with:
          ref: main
          path: validation-receipt

      - name: Record validation start
        shell: bash
        env:
          FEATURE_SHA: ${{ steps.feature.outputs.sha }}
        run: |
          set -euo pipefail
          cd validation-receipt
          mkdir -p .github
          printf 'status=running\npage_url=\nfeature_sha=%s\nrun_id=%s\n' "$FEATURE_SHA" "$GITHUB_RUN_ID" > .github/wano-pages-preview-status.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/wano-pages-preview-status.txt
          if ! git diff --cached --quiet; then
            git commit -m "[skip ci] Record Wano v1 validation start"
            git push origin HEAD:main
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Validate modules and simulation contracts
        run: |
          set -euo pipefail
          node --check src/data.js
          node --check src/world.js
          node --check src/tactical.js
          node --check src/simulation.js
          node --check src/i18n.js
          node --check src/assets.js
          node --check src/koreanize-dom.js
          node --check src/view.js
          node --check src/ui.js
          node --check src/main.js
          npm test

      - name: Install Playwright Chromium
        run: |
          npm install --no-save @playwright/test@latest
          npx playwright install --with-deps chromium

      - name: Run desktop and tablet E2E
        run: npm run test:e2e

      - name: Upload v1 E2E screenshots and traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wano-v1-e2e
          path: test-results
          if-no-files-found: warn
          retention-days: 7

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy v1 preview
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Record successful deployment
        shell: bash
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          FEATURE_SHA: ${{ steps.feature.outputs.sha }}
        run: |
          set -euo pipefail
          cd validation-receipt
          git pull --ff-only origin main
          printf 'status=success\npage_url=%s\nfeature_sha=%s\nrun_id=%s\n' "$PAGE_URL" "$FEATURE_SHA" "$GITHUB_RUN_ID" > .github/wano-pages-preview-status.txt
          git add .github/wano-pages-preview-status.txt
          if ! git diff --cached --quiet; then
            git commit -m "[skip ci] Record Wano v1 Pages deployment"
            git push origin HEAD:main
          fi
