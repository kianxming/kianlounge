name: Wano feature preview on GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/wano-preview-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: wano-pages-preview
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Wano feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/wano-web-vertical-slice

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Validate prototype
        run: |
          set -euo pipefail
          node --check src/data.js
          node --check src/world.js
          node --check src/tactical.js
          node --check src/simulation.js
          node --check src/view.js
          node --check src/ui.js
          node --check src/main.js
          npm test

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy preview
        id: deployment
        uses: actions/deploy-pages@v4
