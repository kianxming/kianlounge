name: Wano feature preview on GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/wano-preview-pages.yml'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: wano-pages-preview
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Wano feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/wano-web-vertical-slice

      - name: Capture feature SHA
        id: feature
        shell: bash
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Validate prototype
        run: |
          set -euo pipefail
          node --check src/data.js
          node --check src/world.js
          node --check src/tactical.js
          node --check src/simulation.js
          node --check src/view.js
          node --check src/ui.js
          node --check src/ux.js
          node --check src/main.js
          grep -q './ux.css' index.html
          grep -q 'YOUR CHARACTERS' src/ux.js
          grep -q "selected={type:'stronghold',id:'kibi_camp'}" src/main.js
          npm test

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy preview
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Checkout main for deployment receipt
        uses: actions/checkout@v4
        with:
          ref: main
          path: deployment-receipt

      - name: Record deployment receipt
        shell: bash
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          FEATURE_SHA: ${{ steps.feature.outputs.sha }}
        run: |
          set -euo pipefail
          cd deployment-receipt
          mkdir -p .github
          printf 'status=success\npage_url=%s\nfeature_sha=%s\nrun_id=%s\n' "$PAGE_URL" "$FEATURE_SHA" "$GITHUB_RUN_ID" > .github/wano-pages-preview-status.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/wano-pages-preview-status.txt
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "[skip ci] Record Wano Pages preview deployment"
          git push origin HEAD:main
